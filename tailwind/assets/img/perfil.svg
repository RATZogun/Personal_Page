<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-label="Monograma com as iniciais G e J">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#BF7950"/>
      <stop offset="48%" stop-color="#A65E44"/>
      <stop offset="100%" stop-color="#591812"/>
    </linearGradient>
    <linearGradient id="brilho" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".26"/>
      <stop offset="100%" stop-color="#400808" stop-opacity=".30"/>
    </linearGradient>
  </defs>

  <rect width="320" height="320" rx="72" fill="url(#fundo)"/>
  <rect width="320" height="320" rx="72" fill="url(#brilho)"/>

  <g fill="none" stroke="#F3E7E0" stroke-opacity=".24" stroke-width="2">
    <circle cx="160" cy="160" r="118"/>
    <circle cx="160" cy="160" r="96"/>
  </g>

  <text x="160" y="160" text-anchor="middle" dominant-baseline="central"
        font-family="Georgia, 'Times New Roman', serif" font-size="128" font-weight="700"
        fill="#FBF2EC" letter-spacing="4">GJ</text>

  <text x="160" y="248" text-anchor="middle"
        font-family="system-ui, Arial, sans-serif" font-size="17" font-weight="600"
        fill="#FBF2EC" fill-opacity=".84" letter-spacing="5">DESENVOLVEDOR</text>
</svg>
